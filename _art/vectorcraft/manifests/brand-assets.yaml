# Verification and publication gates
gates:
  publication:
    - "status is approved"
    - "TODO-001 closed for dark variants; commercial palette approved 2026-11-18"
    - "SVG contains no text, tspan, image, or foreignObject"
    - "SVG has viewBox"
    - "file size under 512 KB"
    - "render_preview at max_side 1024 was inspected"
  review:
    - "target path is under _art/vectorcraft/review/"
    - "filename uses the -review suffix"
    - "manifest status is review-only or blocked"

# Regeneration commands (MCP)
regeneration:
  open_master: "open_file {path: _art/vectorcraft/src/nuitka-master-template.vectorcraft}"
  open_logos: "open_file {path: _art/vectorcraft/src/nuitka-logos.vectorcraft}"
  inspect: "doc_inspect {depth: 3}"
  preview: "render_preview {max_side: 1024, artboard: N}"
  export_svg: "export {path, format: svg, artboard: N, outlineText: true}"
  export_png: "export {path, format: png, artboard: N, scale: 1|2, options: {background: transparent}}"
  export_review: "export to _art/vectorcraft/review/<name>-review.svg with outlineText: true"
  verify: "run _art/vectorcraft/scripts/verify-exports.py"
