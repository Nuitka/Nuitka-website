# Nuitka VectorCraft asset manifest
# Every planned or produced image is defined here so an agent can regenerate it
# deterministically. Keep IDs stable; change status and paths only after verification.

manifest_version: 1
generated: "2026-11-17"
brand_system: "Nuitka Website VectorCraft Brand System"
style_spec: "_art/vectorcraft/style-spec.json"
style_guide: "_art/vectorcraft/STYLE_GUIDE.md"
todo_index: "_art/vectorcraft/TODO.md"

roots:
  art_source: "_art/vectorcraft"
  masters: "_art/vectorcraft/src"
  manifests: "_art/vectorcraft/manifests"
  review: "_art/vectorcraft/review"
  published: "_static/brand"
  legacy_symbol: "_static/Nuitka-Logo-Symbol.svg"

export_rules:
  editorial_mode: "master keeps editable text; export copies are outlined"
  svg:
    outline_text: true
    preserve_editing: false
    forbid_elements: ["text", "tspan", "image", "foreignObject"]
    require_viewbox: true
    max_size_kb: 512
  png:
    outline_source: true
    logo_background: "transparent"
    opengraph_background: "white"
    retina_suffix: "@2x"
  webp:
    quality: 88
    background: "white for OpenGraph cards"
  review:
    suffix: "-review"
    publish: false

wordmark:
  approved:
    family: "Inter"
    style: "SemiBold"
    weight: 600
    effective_size: 216
    tracking: 0
    n_to_u_kerning: "-27/1000 em (equivalent to -3 px at the 112 px sample size)"
  legacy:
    family: "NanumGothic"
    style: "Regular"
    note: "Previous original; not retained during development. Do not use for new artwork."
  rule: "Master keeps editable text; every export outlines it. Do not retype the wordmark in another face."

# Source masters
masters:
  - id: "nuitka-master-template"
    path: "_art/vectorcraft/src/nuitka-master-template.vectorcraft"
    status: "approved"
    purpose: "Named swatches, gradients, artboard presets, and the OpenGraph export settings."
    artboards:
      - name: "brand-board"
        size: "1200x630"
        status: "approved"
        description: "Visible brand board with core palette, surfaces, gradients, dark-theme review warning, and the approved commercial palette note."
      - name: "og-hero"
        size: "1200x630"
        status: "planned"
        description: "Reserved OpenGraph hero composition."
      - name: "docs-architecture"
        size: "1000x560"
        status: "planned"
        description: "Reserved documentation architecture diagram frame."
      - name: "badge-square"
        size: "400x400"
        status: "planned"
        description: "Reserved square product/feature badge."
      - name: "lockup-horizontal"
        size: "1200x300"
        status: "planned"
        description: "Reserved generic horizontal sub-brand lockup."
      - name: "favicon"
        size: "512x512"
        status: "planned"
        description: "Reserved favicon master."
    export_settings:
      state: "configured"
      note: "document.exportForScreens stored the 1200x630 PNG, 2400x1260 PNG @2x, and 1200x630 WebP review settings in the document."

  - id: "nuitka-logos"
    path: "_art/vectorcraft/src/nuitka-logos.vectorcraft"
    status: "approved"
    purpose: "Editable logo suite with separate named artboards for core, monochrome, dark, commercial, and CI/tooling variants."
    artboards:
      - "core-horizontal-light"
      - "core-horizontal-dark"
      - "core-horizontal-mono"
      - "core-symbol-light"
      - "commercial-lockup"
      - "ci-lockup"
      - "watch-lockup"
      - "docs-lockup"
      - "core-horizontal-mono-dark"
      - "vertical-lockup"

# Produced assets
