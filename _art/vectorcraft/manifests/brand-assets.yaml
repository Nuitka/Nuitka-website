    visual_description: "Full-colour emblem at left; black Inter SemiBold wordmark at right; wordmark sits under the emblem height; 1200x260 artboard with safe margins."
    palette: ["logo-blue", "logo-yellow", "logo-grey", "text-heading"]
    typography: "Inter SemiBold 600, effective 216 px, tracking 0, N-u kerning -27/1000 em (outlined on export)"
    alt_text: "Nuitka logo: a grey rounded square with blue and yellow interlocking ribbon arms forming an N, followed by the word Nuitka."
    outputs:
      - { path: "_static/brand/nuitka-logo-horizontal-light.svg", format: "svg", size: "1200x260", status: "approved" }
      - { path: "_static/brand/nuitka-logo-horizontal-light.png", format: "png", size: "1200x260", status: "approved" }
      - { path: "_static/brand/nuitka-logo-horizontal-light@2x.png", format: "png", size: "2400x520", status: "approved" }
